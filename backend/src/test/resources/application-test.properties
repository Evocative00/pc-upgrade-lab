# 일반 테스트는 메모리 DB인 H2를 사용한다. 개인 MySQL 비밀번호가 필요 없으며 실제 MySQL 검사는 mysqlTest로 분리한다.
# MODE=MySQL은 H2의 호환 모드이며 실제 MySQL 서버를 실행한다는 뜻은 아니다.
spring.datasource.url=jdbc:h2:mem:pc-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
# 기존 H2 단위 테스트의 요청 형식은 유지하고, 보안 필터/CSRF는 별도 통합 테스트에서 검증한다.
app.security.csrf.enabled=false
# 기존 API 테스트의 가상 회원 헤더만 명시적으로 허용한다. 실제 로그인 환경의 기본값은 false다.
app.auth.dev-header.enabled=true
