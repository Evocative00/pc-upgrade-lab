# application-local.properties로 복사한 뒤 local 프로필로 실행한다. 개인 설정 파일은 Git에 올리지 않는다.
spring.datasource.url=jdbc:mysql://localhost:3306/pc_upgrade_lab
spring.datasource.username=pc_upgrade_app
# 실제 비밀번호는 실행 환경 변수 DB_PASSWORD로 전달한다.
spring.datasource.password=${DB_PASSWORD}

# schema.sql 등 별도 초기화 대신 Flyway의 버전별 마이그레이션을 사용한다.
spring.sql.init.mode=never

management.endpoints.web.exposure.include=health
management.endpoint.health.show-components=always

# 이번 수집기는 같은 PC의 백엔드에만 연결한다. 다른 PC에서 접속하는 배포용 설정은 아니다.
server.address=127.0.0.1

# 실제 로그인 확인 시 개발용 회원 헤더는 꺼 둔다. local·test 프로필에서도 기본값은 false다.
# 외부에 공개하지 않는 가상 회원 테스트에서만 app.auth.dev-header.enabled=true로 명시적으로 켠다.
app.auth.dev-header.enabled=false

# Google 로그인 사용 시에만 아래 3줄을 개인 application-local.properties에 추가한다.
# GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET은 환경변수로만 설정하고 Git에 올리지 않는다.
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
# spring.security.oauth2.client.registration.google.redirect-uri=${app.frontend.base-url}/login/oauth2/code/google

# 네이버 로그인은 Naver Developers의 OpenID Connect 설정을 사용한다.
# Callback URL: http://127.0.0.1:5173/login/oauth2/code/naver
# 실제 Client ID/Secret은 환경변수로만 전달하고 Git에 올리지 않는다.
# spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
# spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
# spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
# spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
# spring.security.oauth2.client.registration.naver.redirect-uri=${app.frontend.base-url}/login/oauth2/code/naver
