spring.application.name=backend
# 응답을 만드는 중에 뒤늦게 DB를 조회하지 않도록 한다. 엔티티 조회·DTO 변환은 서비스 트랜잭션 안에서 처리한다.
spring.jpa.open-in-view=false
# 테이블 생성·변경은 Flyway가 담당한다. JPA는 엔티티와 실제 테이블이 일치하는지만 확인한다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# 실수로 Flyway clean을 실행해 스키마를 지우는 작업을 막는다.
spring.flyway.clean-disabled=true
# OAuth 완료 후 화면으로 돌아갈 주소. 배포 환경에서는 APP_FRONTEND_BASE_URL로 지정한다.
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://127.0.0.1:5173}
