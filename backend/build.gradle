plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pcupgradelab'
version = '0.0.1-SNAPSHOT'

springBoot {
    mainClass = 'com.pcupgradelab.BackendApplication'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// sourceSet은 함께 컴파일·실행할 코드 묶음이다. 실제 MySQL 검사는 일반 test와 별도 폴더/작업으로 분리한다.
sourceSets {
    mysqlTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    mysqlTestImplementation.extendsFrom testImplementation
    // 실제 MySQL 검사에는 main의 MySQL 드라이버를 사용한다. testRuntimeOnly의 H2는 상속하지 않는다.
    mysqlTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    testRuntimeOnly 'com.h2database:h2'
    mysqlTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
    // 카탈로그 300종과 여러 Spring 테스트 컨텍스트를 함께 검증할 메모리를 확보한다.
    maxHeapSize = '1g'
}

// 검토한 관측 파일을 그대로 번들링한다. JSON 원본은 data/ 한 곳에서 관리한다.
tasks.named('processResources') {
    from('../data/catalog-current-prices') {
        include 'observations-2026-10-06.json', 'observations-expansion50-2026-10-08.json'
        into 'catalog/prices'
    }
    from('../data/catalog-review') {
        include 'catalog-expansion-preview-2026-10-09.json'
        into 'catalog/expansion'
    }
}

// Research preview only: no Spring startup, JDBC, Flyway or catalog apply implementation.
tasks.register('previewCatalogExpansion', JavaExec) {
    group = 'application'
    description = 'Validate 78 research candidates and 300 source identity mapping plans without a database.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pcupgradelab.catalog.expansion.CatalogExpansionPreviewApplication'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    // Windows의 native code page 대신 Gradle이 읽는 UTF-8로 후보 이름을 출력한다.
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    doFirst {
        def applyRequested = project.properties.any { key, value ->
            key.toString().toLowerCase().startsWith('apply') && value.toString().toLowerCase() != 'false'
        }
        if (applyRequested) {
            throw new GradleException('previewCatalogExpansion is read-only; catalog adoption and database apply are not implemented or authorized.')
        }
        def requestedArgs = getArgs() ?: []
        if (requestedArgs.any { it.startsWith('--apply') || it.startsWith('-Papply') }) {
            throw new GradleException('previewCatalogExpansion is read-only; --apply is not implemented or authorized.')
        }
        setArgs(['--source-root', rootProject.projectDir.parentFile.absolutePath] + requestedArgs)
    }
}

// 일반 서버 시작·build·test에서는 DB 자료를 넣지 않는다. 두 작업 모두 기본값은 미리보기다.
tasks.register('importCatalogPrices', JavaExec) {
    group = 'application'
    description = 'Preview the bundled 72 reviewed prices; use -PapplyPrices=true to commit them.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pcupgradelab.catalog.price.CatalogPriceImportApplication'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        def apply = providers.gradleProperty('applyPrices').getOrElse('false')
        if (!(apply in ['true', 'false'])) {
            throw new GradleException('applyPrices must be true or false')
        }
        setArgs(apply == 'true' ? ['--apply'] : [])
    }
}

tasks.register('setupDevCatalog', JavaExec) {
    group = 'application'
    description = 'Preview development data setup; use -PapplyDevCatalog=true for 300 products and 72 prices.'
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.pcupgradelab.catalog.price.CatalogPriceImportApplication'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    doFirst {
        def apply = providers.gradleProperty('applyDevCatalog').getOrElse('false')
        if (!(apply in ['true', 'false'])) {
            throw new GradleException('applyDevCatalog must be true or false')
        }
        setArgs(apply == 'true' ? ['--setup-catalog', '--apply'] : ['--setup-catalog'])
    }
}

// mysqlTest를 직접 실행할 때만 실제 DB를 검사한다. 일반 test/build는 H2를 사용하며 이 작업을 포함하지 않는다.
tasks.register('mysqlTest', Test) {
    group = 'verification'
    description = 'Verify PC persistence and application restart against local MySQL.'
    dependsOn tasks.named('mysqlTestClasses')
    testClassesDirs = sourceSets.mysqlTest.output.classesDirs
    classpath = sourceSets.mysqlTest.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    shouldRunAfter tasks.named('test')
    // DB 상태는 소스 파일 밖에서 바뀔 수 있으므로, 이전 성공 결과를 재사용하지 않고 매번 검사한다.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
