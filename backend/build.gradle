plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pcupgradelab'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

// sourceSet은 함께 컴파일·실행할 코드 묶음이다. 실제 MySQL 검사는 일반 test와 별도 폴더/작업으로 분리한다.
sourceSets {
    mysqlTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    mysqlTestImplementation.extendsFrom testImplementation
    // 실제 MySQL 검사에는 main의 MySQL 드라이버를 사용한다. testRuntimeOnly의 H2는 상속하지 않는다.
    mysqlTestRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-mysql'
    testRuntimeOnly 'com.h2database:h2'
    mysqlTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// mysqlTest를 직접 실행할 때만 실제 DB를 검사한다. 일반 test/build는 H2를 사용하며 이 작업을 포함하지 않는다.
tasks.register('mysqlTest', Test) {
    group = 'verification'
    description = 'Verify PC persistence and application restart against local MySQL.'
    dependsOn tasks.named('mysqlTestClasses')
    testClassesDirs = sourceSets.mysqlTest.output.classesDirs
    classpath = sourceSets.mysqlTest.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    shouldRunAfter tasks.named('test')
    // DB 상태는 소스 파일 밖에서 바뀔 수 있으므로, 이전 성공 결과를 재사용하지 않고 매번 검사한다.
    outputs.upToDateWhen { false }
    outputs.cacheIf { false }
    testLogging {
        events 'passed', 'failed', 'skipped'
    }
}
